name: RAID promo codes

on:
  schedule:
    - cron: "0 7 * * *"   # каждый день в 07:00 UTC (09:00 в Амстердаме летом)
  workflow_dispatch:       # кнопка ручного запуска
    inputs:
      test:
        description: "Отправить тестовое сообщение в Telegram"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Тестовое сообщение
        if: github.event.inputs.test == 'true'
        run: python raid_codes_agent.py --test

      - name: Проверить коды RAID
        if: github.event.inputs.test != 'true'
        run: python raid_codes_agent.py --game raid

      - name: Проверить коды LUDUS
        if: github.event.inputs.test != 'true'
        run: python raid_codes_agent.py --game ludus

      - name: Сохранить историю и списки
        run: |
          git config user.name  "raid-codes-bot"
          git config user.email "actions@github.com"
          git add -A seen_codes.json codes.md seen_codes_ludus.json codes_ludus.md
          git diff --staged --quiet || git commit -m "codes: $(date -u +%Y-%m-%d)"
          git push
