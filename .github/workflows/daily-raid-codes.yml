name: RAID promo codes

on:
  schedule:
    - cron: "0 7 * * *"   # каждый день в 07:00 UTC (09:00 в Амстердаме летом)
  workflow_dispatch:       # кнопка ручного запуска

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Проверить коды
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python raid_codes_agent.py

      - name: Сохранить историю и список
        run: |
          git config user.name  "raid-codes-bot"
          git config user.email "actions@github.com"
          git add seen_codes.json codes.md
          git diff --staged --quiet || git commit -m "codes: $(date -u +%Y-%m-%d)"
          git push
